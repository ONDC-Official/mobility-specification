summary: Airlines - Cancellation by Buyer
details: &details
  - &details_3
    description: Detailed process of cancelling an order.
    mermaid: |-
      sequenceDiagram
        title  Order Confirmation
        participant Buyer Platform (BAP)
        participant Seller Platform (BPP)
        Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
        Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
        Buyer Platform (BAP)->>Seller Platform (BPP): cancel - with soft_cancel request
        Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
        Seller Platform (BPP)->>Buyer Platform (BAP):on_cancel
        Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
        Buyer Platform (BAP)->>Seller Platform (BPP): cancel - with confirm_cancel request
        Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
        Seller Platform (BPP)->>Buyer Platform (BAP):on_cancel
        Buyer Platform (BAP)-->>Seller Platform (BPP): ACK  
    
steps:
  - &steps_7
    summary: Provider platform confirms the order
    api: on_confirm
    details: &steps_7_details
      - &steps_7_details_0
        description: Provider platform confirms the order and provides details of the
          journey upon confirmation
        mermaid: |-
          sequenceDiagram
              participant Buyer Platform (BAP)
              participant Seller Platform (BPP)
              rect rgb(191, 223, 255)
              Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
              Buyer Platform (BAP)-->>Seller Platform (BPP): ACK 
              end
              Buyer Platform (BAP)->>Seller Platform (BPP): cancel
              Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
              
              Seller Platform (BPP)->>Buyer Platform (BAP):on_cancel
              Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example: &steps_7_example
      summary: Confirm ticket booking
      value: &steps_7_example_value
        $ref: ../../examples/airline/on_confirm/Confirm_ticket_booking_1.yaml 
  - &steps_6
      summary: Buyer app requests for cancellation of ride.
      api: cancel
      details: &steps_6_details
        - &steps_6_details_0
          description: Buyer app requests for cancellation of ride with soft cancel.
          mermaid: |-
            sequenceDiagram
              participant Buyer Platform (BAP)
              participant Seller Platform (BPP)

              Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
              Buyer Platform (BAP)-->>Seller Platform (BPP): ACK 
              rect rgb(191, 223, 255)
              Buyer Platform (BAP)->>Seller Platform (BPP): cancel
              Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
              end
              Seller Platform (BPP)->>Buyer Platform (BAP):on_cancel
              Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
      reference: if any
      example: &steps_6_example
        summary: Cancel ticket booking
        value: &steps_6_example_value
          $ref: ../../examples/airline/cancel/cancel_request_soft.yaml
  - &steps_9
    summary: Provider platform accepts/appends the terms of cancellation
    api: on_cancel
    details: &steps_9_details
      - &steps_9_details_0
        description: Provider platform provides the updated order status to the consumer
        mermaid: |-
           sequenceDiagram
              participant Buyer Platform (BAP)
              participant Seller Platform (BPP)

              Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
              Buyer Platform (BAP)-->>Seller Platform (BPP): ACK 
              
              Buyer Platform (BAP)->>Seller Platform (BPP): cancel
              Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
              rect rgb(191, 223, 255)
              Seller Platform (BPP)->>Buyer Platform (BAP):on_cancel
              Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
              end 
    reference: if any
    example: &steps_9_example
      summary: Return cancelled ticket order with cancellation charges
      value: &steps_9_example_value
        $ref: ../../examples/airline/on_cancel/on_cancel_request_soft.yaml
  - &steps_6
      summary: Buyer app requests for cancellation of ride.
      api: cancel
      details: &steps_6_details
        - &steps_6_details_0
          description: Buyer app requests for cancellation of ride with confirm cancel.
          mermaid: |-
            sequenceDiagram
              participant Buyer Platform (BAP)
              participant Seller Platform (BPP)
              rect rgb(191, 223, 255)
              Buyer Platform (BAP)->>Seller Platform (BPP): cancel
              Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
              end
              Seller Platform (BPP)->>Buyer Platform (BAP):on_cancel
              Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
      reference: if any
      example: &steps_6_example
        summary: Cancel ticket booking
        value: &steps_6_example_value
          $ref: ../../examples/airline/cancel/cancel_request_confirm.yaml
  - &steps_9
    summary: Provider platform accepts/appends the terms of cancellation
    api: on_cancel
    details: &steps_9_details
      - &steps_9_details_0
        description: Provider platform provides the updated order status to the consumer
        mermaid: |-
           sequenceDiagram
              participant Buyer Platform (BAP)
              participant Seller Platform (BPP)
              Buyer Platform (BAP)->>Seller Platform (BPP): cancel
              Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
              rect rgb(191, 223, 255)
              Seller Platform (BPP)->>Buyer Platform (BAP):on_cancel
              Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
              end 
    reference: if any
    example: &steps_9_example
      summary: Return cancelled ticket order with cancellation charges
      value: &steps_9_example_value
        $ref: ../../examples/airline/on_cancel/on_cancel_request_confirm.yaml
