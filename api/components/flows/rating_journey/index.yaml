summary: On-Demand - Rating(Success)
details: &details
  - &details_0
    description: Detailed process of rating.
    mermaid: >-
      sequenceDiagram
        participant Buyer Platform (BAP)
        participant Seller Platform (BPP)
        Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
        Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
        Seller Platform (BPP)->>Buyer Platform (BAP):on_status
        Buyer Platform (BAP)-->>Seller Platform (BPP): ACK 
        Buyer Platform (BAP)->>Seller Platform (BPP): rating
        Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
              
steps: 
  - summary: Ride provider confirms the ride request
    api: on_confirm
    details:
      - description:
          Ride provider confirms the ride request and provides the ride
          details on confirmation.
        mermaid: |-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Buyer Platform (BAP)->>Seller Platform (BPP): confirm
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP): on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      summary: Return confirmed order with latest fulfillment details
      value:
        $ref: ../../examples/on-demand/on_confirm/Return_confirmed_order_with_latest_fulfillment_details___X10.yaml
  - summary: Ride provider provides latest order status
    api: on_status
    details:
      - description: Ride provider provides the updated order status to the buyer app
        mermaid: |-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Buyer Platform (BAP)->>Seller Platform (BPP): confirm
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      summary: Return updated order with updated agent details
      value:
        $ref: ../../examples/on-demand/on_status/on_status_ride_provider_provides_the_updated_order_status_to_the_buyer_app_1.yaml
  - summary: Buyer app requests for tracking status
    api: track
    details:
      - description:
          Buyer app request the provider platform to provide with latest
          tracking status
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): track - Request tracking status
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP): on_track - Provide tracking status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      summary: Track an active ride
      value:
        $ref: ../../examples/on-demand/track/Track_an_active_ride___X31.yaml
  - summary: Provider platform provides latest order tracking status
    api: on_track
    details:
      - description:
          Provider platform provides the updated order tracking status to the
          consumer
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Buyer Platform (BAP)->>Seller Platform (BPP): track - Request tracking status
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_track - Provide tracking status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK 
            end
    reference: if any
    example:
      summary: Return tracking information for an order
      value:
        $ref: ../../examples/on-demand/on_track/Return_tracking_information_for_an_order___X23.yaml
  - summary: Ride provider provides latest order status
    api: on_status
    details:
      - description: Ride provider provides the updated order status to the buyer app
        mermaid: "sequenceDiagram

          \  participant Buyer Platform (BAP)

          \  participant Seller Platform (BPP)

          \  rect rgb(191, 223, 255)

          \  Seller Platform (BPP)->>Buyer Platform (BAP): on_status

          \  Buyer Platform (BAP)-->>Seller Platform (BPP): ACK

          \  end

          \  Seller Platform (BPP)->>Buyer Platform (BAP): on_status

          \  Buyer Platform (BAP)-->>Seller Platform (BPP): ACK

          \  "
    reference: if any
    example:
      summary: Return updated order with updated agent details
      value:
        $ref: ../../examples/on-demand/on_status/on_status_ride_provider_provides_the_updated_order_status_to_the_buyer_app_12.yaml
  - summary: Ride provider provides latest order updates
    api: on_status
    details:
      - description: Ride provider provides the updated order status to the buyer app
        mermaid: |-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      summary: Return updated order with updated agent details
      value:
        $ref: ../../examples/on-demand/on_status/on_status_ride_provider_provides_the_updated_order_status_to_the_buyer_app_3.yaml
  - summary: Ride provider provides latest update on the ride (unsolicited call)
    api: on_update
    details:
      - description:
          Ride provider provides the updated order updates to the buyer app &
          can update the quote in case of fare update
        mermaid: |-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
            Buyer Platform (BAP)->>Seller Platform (BPP): status
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            Seller Platform (BPP)->>Buyer Platform (BAP): on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      summary: Return updated order with recomputed charges
      value:
        $ref: ../../examples/on-demand/on_update/Return_updated_order_with_recomputed_charges___X24.yaml
  - summary: Buyer app seeks the most recent status update
    api: status
    details:
      - description: Buyer app requests the ride provider to provide the latest order status
        mermaid: |-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): status
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP): on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      summary: Get latest fulfillment status of a booking
      value:
        $ref: ../../examples/on-demand/status/Get_latest_fulfillment_status_of_a_booking___X29.yaml
  - summary: Ride provider provides latest order status
    api: on_status
    details:
      - description: Ride provider provides the updated order status to the buyer app
        mermaid: |-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            Buyer Platform (BAP)->>Seller Platform (BPP): status
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
            Buyer Platform (BAP)->>Seller Platform (BPP): rating
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
    reference: if any
    example:
      summary: Return order with status - Driver at pickup
      value:
        $ref: ../../examples/on-demand/on_status/on_status_ride_provider_provides_the_updated_order_status_to_the_buyer_app_4.yaml

  - &steps_1
    summary: Buyer app provides rating for an entity
    api: rating
    details:
      - description: Buyer app provides rating for an entity
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            Buyer Platform (BAP)->>Seller Platform (BPP): status
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            Seller Platform (BPP)->>Buyer Platform (BAP): on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): rating
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
    reference: if any
    example: 
      summary: Buyer app provides rating for an entity
      value: &steps_1_example_value
        $ref: ../../examples/on-demand/rating/rating_request.yaml
  