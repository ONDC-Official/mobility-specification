summary: Unreserved Entry Pass - Cancellation Flow(unsolicited on_cancel)
details: &details
  - &details_0
    description: Detailed process of cancelling a ticket with unsolicited on_cancel.
    mermaid: >-
      sequenceDiagram
        participant Buyer Platform (BAP)
        participant Seller Platform (BPP)
        Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
        Buyer Platform (BAP)-->>Seller Platform (BPP): ACK 
        Seller Platform (BPP)->>Buyer Platform (BAP):on_cancel
        Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
steps: &steps
  - &steps_0
    summary: Provider confirms the request
    api: on_confirm
    details: &steps_0_details
      - &steps_0_details_0
        description: Provider platform confirms the order and provides details of the journey on confirmation
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK 
            end
            Buyer Platform (BAP)->>Seller Platform (BPP): cancel - with soft_cancel request
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            Seller Platform (BPP)->>Buyer Platform (BAP):on_cancel
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example: &steps_0_example
      summary: Return confirmed ticket order with payment confirmation
      value: &steps_0_example_value
        $ref: ../../examples/unreserved-entry-pass/on_confirm/Return_confirmed_ticket_order_with_payment_confirmation.yaml 
  - &steps_4
    summary: Provider sends the unsolicited on_cancel 
    api: on_cancel
    details: &steps_4_details
      - &steps_4_details_0
        description: Provider accepts the terms of order and provides with latest order
          update.
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Buyer Platform (BAP)->>Seller Platform (BPP): cancel - with confirm_cancel request
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_cancel
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end 
    reference: if any
    example: &steps_4_example
      summary: Cancel ticket booking
      value: &steps_4_example_value
        $ref: ../../examples/unreserved-entry-pass/on_cancel/on_cancel_unsolicited.yaml
