search:
  context:
    action:
      - code: search
        description: Buyer app indicates the search intent
        reference: <PR/Issue/Discussion Links md format text>
    location: &a1
      country:
        code:
          - code: IND
            description: Represents the country
            reference: <PR/Issue/Discussion Links md format text>
      city:
        code:
          - code: std:080
            description: Bangalore
            reference: <PR/Issue/Discussion Links md format text>
    domain: &a2
      - code: ONDC:TRV10
        description: mobility domain Ride
        reference: <PR/Issue/Discussion Links md format text>
  message:
    intent:
      category: &a14
        descriptor:
          code:
            - code: ON_DEMAND_TRIP
              description: Describes the category of the on_demand offer
              reference: <PR/Issue/Discussion Links md format text
            - code: ON_DEMAND_RENTAL
              description: Describes the category of the rental ride offer
              reference: <PR/Issue/Discussion Links md format text  
            - code: SCHEDULED_TRIP
              description: Describes the category of the scheduled ride offer
              reference: <PR/Issue/Discussion Links md format text
            - code: SCHEDULED_RENTAL
              description: Describes the category of the scheduled ride offer
              reference: <PR/Issue/Discussion Links md format text  
            
      fulfillment: &a3
        vehicle:
          category:
            - code: AUTO_RICKSHAW
              description: Describes the vehicle category as Auto Rickshaw
              reference: <PR/Issue/Discussion Links md format text
            - code: CAB
              description: Describes the vehicle category as cab
              reference: <PR/Issue/Discussion Links md format text
            - code: TWO_WHEELER
              description: Describes the vehicle category as TWO_WHEELER
              reference: <PR/Issue/Discussion Links md format text
          variant:
            - code: SEDAN
              description: Describes the vehicle variant for category type CAB
              reference: <PR/Issue/Discussion Links md format text
            - code: SUV
              description: Describes the vehicle variant for category type CAB
              reference: <PR/Issue/Discussion Links md format text
            - code: HATCHBACK
              description: Describes the vehicle variant for category type CAB
              reference: <PR/Issue/Discussion Links md format text
            - code: TWO_WHEELER
              description: Describes the vehicle variant for category TWO_WHEELER
              reference: <PR/Issue/Discussion Links md format text
            - code: AUTO_RICKSHAW
              description: Describes the vehicle variant for category AUTO_RICKSHAW
              reference: <PR/Issue/Discussion Links md format text
          energy_type: 
            - code: ELECTRIC
              description: Describes the vehicle energy_type as Electric
              reference: <PR/Issue/Discussion Links md format text
            - code: PETROL
              description: Describes the vehicle energy_type as Petrol
              reference: <PR/Issue/Discussion Links md format text
            - code: DIESEL
              description: Describes the vehicle energy_type as Diesel
              reference: <PR/Issue/Discussion Links md format text
            - code: HYDROGEN
              description: Describes the vehicle energy_type as Hydrogen
              reference: <PR/Issue/Discussion Links md format text
            - code: BIOFUELS
              description: Describes the vehicle energy_type as Biofuels
              reference: <PR/Issue/Discussion Links md format text
            - code: CNG
              description: Describes the vehicle energy_type as CNG
              reference: <PR/Issue/Discussion Links md format text
            - code: LPG
              description: Describes the vehicle energy_type as LPG
              reference: <PR/Issue/Discussion Links md format text

        type:
          - code: DELIVERY
            description: Describes the type of fulfillment.
            reference: <PR/Issue/Discussion Links md format text
          - code: SELF_PICKUP
            description: Describes the type of fulfillment.
            reference: <PR/Issue/Discussion Links md format text
        stops:
          type:
            - code: START
              description: Describes the initial fulfillment location.
              reference: <PR/Issue/Discussion Links md format text
            - code: END
              description: Describes the final fulfillment location.
              reference: <PR/Issue/Discussion Links md format text
          authorization:
            type:
              - code: OTP
                description: Describes OTP as an authorization mechanism used to start or end
                  the fulfillment of an order.
                reference: <PR/Issue/Discussion Links md format text
              - code: QR
                description: Describes QR as an authorization mechanism used to start or end the
                  fulfillment of an order.
                reference: <PR/Issue/Discussion Links md format text
            status:
              - code: UNCLAIMED
                description: Describes the authorization status
                reference: <PR/Issue/Discussion Links md format text
              - code: CLAIMED
                description: Describes the authorization status
                reference: <PR/Issue/Discussion Links md format text
        state: &a8
          descriptor:
            code:
              - code: RIDE_CANCELLED
                description: The rider has canceled the ride.
                reference: <PR/Issue/Discussion Links md format text
              - code: RIDE_ENDED
                description: Describes when the rider concludes the journey.
                reference: <PR/Issue/Discussion Links md format text
              - code: RIDE_STARTED
                description: Describes when the rider initiates the journey.
                reference: <PR/Issue/Discussion Links md format text
              - code: RIDE_ASSIGNED
                description: Describes the state when the ride is assigned.
                reference: <PR/Issue/Discussion Links md format text
              - code: RIDE_ENROUTE_PICKUP
                description: Rider en route to pickup location."
                reference: <PR/Issue/Discussion Links md format text
              - code: RIDE_ARRIVED_PICKUP
                description: Describes the state when the rider has arrived at the pickup
                  location.
                reference: <PR/Issue/Discussion Links md format text
              - code: RIDE_CONFIRMED
                description: Describes the state when the ride is confirmed.
                reference: <PR/Issue/Discussion Links md format text
        agent:
          person:
            creds:
              type: 
                - code: MEMBERSHIP_TIER
                  description: Describes the cred type as  BPP membership tier.
                  reference: <PR/Issue/Discussion Links md format text
                - code: ACTIVE_SINCE
                  description: Describes the cred type as active since.
                  reference: <PR/Issue/Discussion Links md format text
                - code: ACHIEVEMENTS
                  description:  Describes the cred type as achievements.
                  reference: <PR/Issue/Discussion Links md format text
                - code: BADGES
                  description:  Describes the cred type as badges.
                  reference: <PR/Issue/Discussion Links md format text
                - code: TOTAL_NUMBER_OF_TRIPS
                  description:  Describes the cred type as total number of trips.
                  reference: <PR/Issue/Discussion Links md format text        
                

      payment: &a4
        status:
          - code: NOT-PAID
            description: NOT-PAID indicates a payment status where the payment process has
              not been completed.
            reference: <PR/Issue/Discussion Links md format text
          - code: PAID
            description: PAID indicates a payment status where the payment process has been
              successfully completed.
            reference: <PR/Issue/Discussion Links md format text
        collected_by:
          - code: BPP
            description: Describes when the seller app is collecting the payment.
            reference: <PR/Issue/Discussion Links md format text
          - code: BAP
            description: Describes when the buyer app is collecting the payment.
            reference: <PR/Issue/Discussion Links md format text
        type:
          - code: PRE_ORDER
            description: Payment occurs prior to order placement.
            reference: <PR/Issue/Discussion Links md format text
          - code: ON_ORDER
            description: Payment occurs on order placement.
            reference: <PR/Issue/Discussion Links md format text
          - code: ON_FULFILLMENT
            description: Payment occurs upon completion of the journey.
            reference: <PR/Issue/Discussion Links md format text
          - code: POST_FULFILLMENT
            description: Payment occurs after completion of the journey.
            reference: <PR/Issue/Discussion Links md format text  
          - code: ON_CANCELLATION
            description: Payment occurs on order cancel.
            reference: <PR/Issue/Discussion Links md format text
          - code: POST_CANCELLATION
            description: Payment occurs after order cancel.
            reference: <PR/Issue/Discussion Links md format text    
on_search:
  context:
    action:
      - code: on_search
        description: Seller app provides catalog based on search intent.
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message:
    catalog:
      providers:
        items: &a5
          descriptor:
            code:
              - code: RIDE
                description: Describes the type of ride.
                reference: <PR/Issue/Discussion Links md format text
              - code: RENTAL
                description: Describes the type of ride.
                reference: <PR/Issue/Discussion Links md format text  
        fulfillments: *a3
        payments: *a4
        categories: *a14

select:
  context:
    action:
      - code: select
        description: Buyer app communicates selected items and quantities.
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message: &a7
    order:
      items: *a5
      fulfillments: *a3
      payments: *a4
on_select:
  context:
    action:
      - code: on_select
        description: Seller app provides serviceability info, quotes, and O2D TAT for
          selected items.
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message: &a12
    order:
      items: *a5
      fulfillments: *a3
      payments: *a4
      quote: &a9
        breakup:
          title:
            - code: BASE_FARE
              description: Describes the base fare for a specific ride.
              reference: <PR/Issue/Discussion Links md format text
            - code: DISTANCE_FARE
              description: Describes the distance fare for a specific ride.
              reference: <PR/Issue/Discussion Links md format text
            - code: CANCELLATION_CHARGES
              description: Describes the cancellation charges for a specific ride.
              reference: <PR/Issue/Discussion Links md format text
            - code: REFUND
              description: Describes the refund for a specific ride.
              reference: <PR/Issue/Discussion Links md format text
            - code: TOLL_CHARGES
              description: Describes the toll charges for the specific ride.
              reference: <PR/Issue/Discussion Links md format text
            - code: PARKING_CHARGES
              description: Describes the parking charges for the specific ride.
              reference: <PR/Issue/Discussion Links md format text
            - code: TAX
              description: Describes the tax for a specific ride.
              reference: <PR/Issue/Discussion Links md format text
            - code: WAITING_CHARGES
              description: Describes the waiting charges for a specific ride.
              reference: <PR/Issue/Discussion Links md format text
            - code: DRIVER_BATA
              description: Describes the driver bata for a specific ride.
              reference: <PR/Issue/Discussion Links md format text
            - code: NIGHT_CHARGES
              description: Describes the night charges for a specific ride.
              reference: <PR/Issue/Discussion Links md format text

init:
  context:
    action:
      - code: init
        description: Buyer and seller apps confirm terms & conditions before placing orders.
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message: *a7
on_init:
  context:
    action:
      - code: on_init
        description: Buyer and seller apps agree to terms & conditions before placing
          orders.
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message: 
    order:
      items: *a5
      fulfillments: *a3
      payments: *a4
      cancellation_terms:
        fulfillment_state: *a8
      quote: *a9
confirm:
  context:
    action:
      - code: confirm
        description: Buyer app submits orders on behalf of the buyer.
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message: *a7
on_confirm:
  context:
    action:
      - code: on_confirm
        description: Seller app responds to the order with auto-acceptance, deferred
          acceptance, or rejection.
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message: &a10
    order:
      items: *a5
      fulfillments: *a3
      payments: *a4
      cancellation_terms:
        fulfillment_state: *a8
      quote: *a9
      status: &a13
        - code: SOFT_CANCEL
          description: Describes a soft cancel request initiated by the buyer app, a step
            preceding cancellation.
          reference: <PR/Issue/Discussion Links md format text
        - code: CONFIRM_CANCEL
          description: Describes a confirm cancel request initiated by the buyer app,
            confirming the order cancellation
          reference: <PR/Issue/Discussion Links md format text
        - code: ACTIVE
          description: Describes the status of the order.
          reference: <PR/Issue/Discussion Links md format text
        - code: COMPLETED
          description: Describes the status of the order.
          reference: <PR/Issue/Discussion Links md format text
        - code: CANCELLED
          description: Describes the status of the order.
          reference: <PR/Issue/Discussion Links md format text

status:
  context:
    action:
      - code: status
        description: Buyer app request for status of the order
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
on_status:
  context:
    action:
      - code: on_status
        description: Seller app return order with status , Driver pickup - driver drop
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message: 
    order: 
      items: *a5
      fulfillments: *a3
      payments: *a4
      cancellation_terms:
        fulfillment_state: *a8
      quote: *a9
      status: *a13
      documents:
        descriptor:
          code:
            - code: INVOICE
              description: Describes the invoice document, available on ride completion
              reference: <PR/Issue/Discussion Links md format text>
      
cancel:
  context:
    action:
      - code: cancel
        description: Buyer app requests order cancellation."
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message:
    cancellation_reason_id: &a11
      - code: "000"
        description: Technical cancellation of orders in case protocol technical failures(BAP/BPP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "001"
        description: Driver not moving(BAP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "002"
        description: Customer is unable to unable to contact driver(BAP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "003"
        description: Driver asked to cancel the ride(BAP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "004"
        description: My pickup location is incorrect(BAP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "005"
        description: Customer booked the ride mistakenly(BAP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "006"
        description: Safety concern with driver/ ride(BAP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "007"
        description: Vehicle appears unsafe or non-compliant(BAP)
        reference: <PR/Issue/Discussion Links md format text    
      - code: "011"
        description: Seller app cannot confirm the ride as no drivers are available(BPP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "012"
        description: Rider not present at location(BPP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "013"
        description: Driver accepted the ride mistakenly(BPP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "014"
        description: Unable to contact rider(BPP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "015"
        description: Stopped by traffic officialsBPP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "016"
        description: Punctured tyre, engine issues(BPP)
        reference: <PR/Issue/Discussion Links md format text
      - code: "017"
        description: Customer misconduct or safety concern(BPP)
        reference: <PR/Issue/Discussion Links md format text      
    descriptor:
      code: *a13
on_cancel:
  context:
    action:
      - code: on_cancel
        description: Seller app specifies the cancellation status.
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message:
    order:
      items: *a5
      fulfillments: *a3
      payments: *a4
      cancellation:
        cancelled_by:
          - code: CONSUMER
            description: Describes, when the ride is cancelled by the consumer.
            reference: <PR/Issue/Discussion Links md format text>
          - code: PROVIDER
            description: Describes, when the ride is cancelled by the provider.
            reference: <PR/Issue/Discussion Links md format text>
        reason:
          descriptor:
            code: *a11
      quote: *a9
      status: *a13
update:
  context:
    action:
      - code: update
        description: Buyer app requests order update."
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message: *a12
on_update:
  context:
    action:
      - code: on_cancel
        description: Seller app specifies the update status.
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message:
    order:
      items: *a5
      fulfillments: *a3
      payments: *a4
      status: *a13
      quote: *a9
track:
  context:
    action:
      - code: track
        description: Buyer app requests order track."
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
on_track:
  context:
    action:
      - code: on_track
        description: Seller app specifies the on_track.
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2    
support:
  context:
    action:
      - code: support
        description: Buyer app requests order support."
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message:
    support:
      descriptor: &supportCodes
        code:
          - code: SOS
            description: Describes the support code value as SOS
            reference: <PR/Issue/Discussion Links md format text>
          - code: LONG_HALT
            description: Describes the support code value as LONG_HALT
            reference: <PR/Issue/Discussion Links md format text>
          - code: ROUTE_DEV
            description: Describes the support code value as ROUTE_DEV
            reference: <PR/Issue/Discussion Links md format text>
on_support:
  context:
    action:
      - code: on_support
        description: Buyer app requests order support."
        reference: <PR/Issue/Discussion Links md format text>
    location: *a1
    domain: *a2
  message:
    support:
      descriptor: *supportCodes


