select: &select
  message: &select_message
    order: &select_message_order
      fulfillments: *on_search_message_catalog_providers_fulfillments
on_select: &on_select
  message: &on_select_message
    order: &on_select_message_order
      fulfillments: *on_search_message_catalog_providers_fulfillments
      items: *on_search_message_catalog_providers_items
      quote: &quote
        breakup: 
          item:
            tags:
              - code: TAX
                description: Describes the TAX details
                reference: <PR/Issue/Discussion Links md format text>
                list:
                  - code: CGST
                    description: Describes the CGST
                    reference: <PR/Issue/Discussion Links md format text>
                  - code: SGST
                    description: Describes the SGST
                    reference: <PR/Issue/Discussion Links md format text>
              - code: OTHER_CHARGES
                description: Describes the other charges
                reference: <PR/Issue/Discussion Links md format text>
                list:
                  - code: SURCHARGE
                    description: Describes the surcharge
                    reference: <PR/Issue/Discussion Links md format text>
      tags:
       - *on_search_message_catalog_providers_tags_0           

init: &init
  message: &init_message
    order: &init_message_order
      tags:
       - *BAP_TERMS
       - *on_search_message_catalog_providers_tags_0

on_init: &on_init
  message: &on_init_message
    order: &on_init_message_order
      fulfillments: *on_search_message_catalog_providers_fulfillments
      items: *on_search_message_catalog_providers_items
      quote: *quote
      tags:
        - *BPP_TERMS
        - *on_search_message_catalog_providers_tags_0
confirm:
  message:
    order:
      tags:
        - *BAP_TERMS
        - *BPP_TERMS
        - *on_search_message_catalog_providers_tags_0
on_confirm: &on_confirm
  message: &on_init_message
    order: &on_init_message_order
      fulfillments: *on_search_message_catalog_providers_fulfillments
      items: *on_search_message_catalog_providers_items
      quote: *quote
      tags:
        - *BAP_TERMS
        - *BPP_TERMS
        - *on_search_message_catalog_providers_tags_0
on_status: *on_confirm
on_cancel: *on_confirm
on_update: *on_confirm
