search: &search
  message: &search_message
    intent: &search_message_intent
      payment: &search_message_intent_payment
        tags: &search_message_intent_payment_tags
          - &search_message_intent_payment_tags_0
            code: BUYER_FINDER_FEES
            description: Describes the finder fees for buyer
            reference: <PR/Issue/Discussion Links md format text>
            list: &search_message_intent_payment_tags_0_list
              - &search_message_intent_payment_tags_0_list_1
                code: BUYER_FINDER_FEES_PERCENTAGE
                description: Buyer finder fee in percentage
                reference: <PR/Issue/Discussion Links md format text>
              - &search_message_intent_payment_tags_0_list_2
                code: BUYER_FINDER_FEES_AMOUNT
                description: Buyer finder fee in amount
                reference: <PR/Issue/Discussion Links md format text>
              - &search_message_intent_payment_tags_0_list_2
                code: BUYER_FINDER_FEES_TYPE
                description: Buyer finder fee type
                reference: <PR/Issue/Discussion Links md format text>  
                
          - &search_message_intent_payment_tags_1
            code: SETTLEMENT_TERMS
            description: Describes the settlement terms
            reference: <PR/Issue/Discussion Links md format text>
            list: &search_message_intent_payment_tags_1_list
              - &search_message_intent_payment_tags_1_list_0
                code: SETTLEMENT_WINDOW
                description: Time window to complete settlement
                reference: <PR/Issue/Discussion Links md format text>
              - &search_message_intent_payment_tags_1_list_1
                code: SETTLEMENT_BASIS
                description: Basis required to complete settlement
                reference: <PR/Issue/Discussion Links md format text>
              - &search_message_intent_payment_tags_1_list_2
                code: SETTLEMENT_TYPE
                description: Payment method to complete settlement
                reference: <PR/Issue/Discussion Links md format text>
              - &search_message_intent_payment_tags_1_list_3
                code: MANDATORY_ARBITRATION
                description: Flag to denote if dispute can be resolved through arbitration
                reference: <PR/Issue/Discussion Links md format text>
              - &search_message_intent_payment_tags_1_list_4
                code: COURT_JURISDICTION
                description: Denotes court that will have jurisdiction for the case
                reference: <PR/Issue/Discussion Links md format text>
              - &search_message_intent_payment_tags_1_list_5
                code: DELAY_INTEREST
                description: Denotes interest to be paid as a delay charge
                reference: <PR/Issue/Discussion Links md format text>
              - &search_message_intent_payment_tags_1_list_6
                code: STATIC_TERMS
                description: Terms for settlement
                reference: <PR/Issue/Discussion Links md format text>
              - &search_message_intent_payment_tags_1_list_7
                code: SETTLEMENT_AMOUNT
                description: Denotes settlement amount
                reference: <PR/Issue/Discussion Links md format text>
on_search: &on_search
  message: &on_search_message
    catalog: &on_search_message_catalog
      providers: &on_search_message_catalog_providers
        items: &on_search_message_catalog_providers_items
          tags: &on_search_message_catalog_providers_items_tags
            - &on_search_message_catalog_providers_items_tags_0
              code: FARE_POLICY
              description: Details about fare for the ride
              reference: <PR/Issue/Discussion Links md format text>
              list: &on_search_message_catalog_providers_items_tags_0_list
                - &on_search_message_catalog_providers_items_tags_0_list_0
                  code: MIN_FARE
                  description: Describes the minimum fare
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_items_tags_0_list_1
                  code: MIN_FARE_DISTANCE_KM
                  description: Describes the minimum fare per KM
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_items_tags_0_list_2
                  code: PER_KM_CHARGE
                  description: Describes the per km charge
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_items_tags_0_list_3
                  code: PICKUP_CHARGE
                  description: Describes the pickup charge
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_items_tags_0_list_4
                  code: WAITING_CHARGE_PER_MIN
                  description: Describes the waiting charge per minute
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_items_tags_0_list_5
                  code: NIGHT_CHARGE_MULTIPLIER
                  description: Describes the times need to multiply for night charge
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_items_tags_0_list_6
                  code: NIGHT_SHIFT_START_TIME
                  description: Describes the time when night shift starts
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_items_tags_0_list_7
                  code: NIGHT_SHIFT_END_TIME
                  description: Describes the time when night shift ends
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_items_tags_0_list_8
                  code: RESTRICTED_PERSON
                  description: Describes the restricted person
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_items_tags_0_list_9
                  code: RESTRICTION_PROOF
                  description: Describes the proof needed for restriction
                  reference: <PR/Issue/Discussion Links md format text>
            - &on_search_message_catalog_providers_items_tags_1
              code: GENERAL_INFO
              description: General information about airlines
              reference: <PR/Issue/Discussion Links md format text>
              list: &on_search_message_catalog_providers_items_tags_1_list
                - &on_search_message_catalog_providers_items_tags_1_list_0
                  code: CABIN_BAGGAGE
                  description: Allowed limit for cabin baggage
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_items_tags_1_list_1
                  code: CHECK_IN_BAGGAGE
                  description: Allowed limit for checkin baggage
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_items_tags_1_list_2
                  code: PROHIBITED_ITEMS
                  description: Describes the list of prohibited items
                  reference: <PR/Issue/Discussion Links md format text>
        fulfillments: &on_search_message_catalog_providers_fulfillments
          tags: &on_search_message_catalog_providers_fulfillments_tags
            - &on_search_message_catalog_providers_fulfillments_tags_0
              code: SEAT_GRID
              description: Seat details to identify specifics of seat
              reference: <PR/Issue/Discussion Links md format text>
              list: &on_search_message_catalog_providers_fulfillments_tags_0_list
                - &on_search_message_catalog_providers_fulfillments_tags_0_list_0
                  code: X
                  description: Describes the x-axis co-ordinate of seat
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_0_list_1
                  code: Y
                  description: Describes the y-axis co-ordinate of seat
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_0_list_2
                  code: Z
                  description: Describes the z-axis co-ordinate of seat
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_0_list_3
                  code: X_SIZE
                  description: describes the x-axis size of seat
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_0_list_4
                  code: Y_SIZE
                  description: Describes the y-axis size of seat
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_0_list_5
                  code: SEAT_NUMBER
                  description: Describes the seat number for assigned ticket
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_0_list_6
                  code: RESTRICTED_GENDER
                  description: Describes the restricted gender for assigned ticket
                  reference: <PR/Issue/Discussion Links md format text>
                  list:
                    - code: MALE
                      description: Describes the gender as MALE
                      reference: <PR/Issue/Discussion Links md format text>
                    - code: FEMALE
                      description: Describes the gender as FEMALE
                      reference: <PR/Issue/Discussion Links md format text>  

                - &on_search_message_catalog_providers_fulfillments_tags_0_list_7
                  code: SINGLE_SEAT
                  description: describes if assigned ticket seat is single or not
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_0_list_8
                  code: SEAT_PRICE
                  description: Describes the price for particular seat
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_0_list_9
                  code: ITEM_ID
                  description: Describes the item id to which the seat grid is attached
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_0_list_10
                  code: SELECTED
                  description: Describes the seat status selected by the buyer app
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_0_list_11
                  code: AVAILABLE
                  description: Describes whether seat is available for selection or not
                  reference: <PR/Issue/Discussion Links md format text>
                - code: NUMBER
                  description: Describes the seat number
                  reference: <PR/Issue/Discussion Links md format text>
                - code: SELECTED_SEAT
                  description: Describes the selected seat
                  reference: <PR/Issue/Discussion Links md format text>    
            - &on_search_message_catalog_providers_fulfillments_tags_1
              code: VEHICLE_GRID
              description: Vehicle details to identify specifics of vehicle
              reference: <PR/Issue/Discussion Links md format text>
              list: &on_search_message_catalog_providers_fulfillments_tags_1_list
                - &on_search_message_catalog_providers_fulfillments_tags_1_list_0
                  code: X_MAX
                  description: Describes the max x-axis co-ordinate of vehicle
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_1_list_1
                  code: Y_MAX
                  description: Describes the max y-axis co-ordinate of vehicle
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_1_list_2
                  code: Z_MAX
                  description: Describes the max z-axis co-ordinate of vehicle
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_1_list_3
                  code: X_LOBBY_START
                  description: Describes the x-axis starting point
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_1_list_4
                  code: X_LOBBY_SIZE
                  description: Describes the x-axis size of lobby
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_1_list_5
                  code: Y_LOBBY_START
                  description: Describes the y-axis starting point
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_1_list_6
                  code: Y_LOBBY_SIZE
                  description: Describes the y-axis size of lobby
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_1_list_7
                  code: SEAT_SELECTION
                  description: Describes whether seat selection is mandatory or optional
                  reference: <PR/Issue/Discussion Links md format text>
            - &on_search_message_catalog_providers_fulfillments_tags_2
              code: VEHICLE_AVAIBALITY
              description: Details about the availability of a vehicle
              reference: <PR/Issue/Discussion Links md format text>
              list: &on_search_message_catalog_providers_fulfillments_tags_2_list
                - &on_search_message_catalog_providers_fulfillments_tags_2_list_0
                  code: AVALIABLE_SEATS
                  description: Describes the available seats present in vehicle
                  reference: <PR/Issue/Discussion Links md format text>
            - &on_search_message_catalog_providers_fulfillments_tags_3
              code: ROUTE_INFO
              description: Describes the information about the route
              reference: <PR/Issue/Discussion Links md format text>
              list: &on_search_message_catalog_providers_fulfillments_tags_3_list
                - &on_search_message_catalog_providers_fulfillments_tags_3_list_0
                  code: ROUTE_ID
                  description: Describes the route id of the journey for bus
                  reference: <PR/Issue/Discussion Links md format text>
                - &on_search_message_catalog_providers_fulfillments_tags_3_list_1
                  code: ROUTE_DIRECTION
                  description: Describes the direction of a particular route
                  reference: <PR/Issue/Discussion Links md format text>
            - code: VEHICLE_AMENITIES
              description: Describes the vehicle amenities
              reference: <PR/Issue/Discussion Links md format text>
        payments: *search_message_intent_payment
select: &select
  message: &select_message
    order: &select_message_order
      fulfillments: *on_search_message_catalog_providers_fulfillments
on_select: &on_select
  message: &on_select_message
    order: &on_select_message_order
      fulfillments: *on_search_message_catalog_providers_fulfillments
      items: *on_search_message_catalog_providers_items
      quote: &on_select_message_order_quote
        breakup: &on_select_message_order_quote_breakup
          item: &on_select_message_order_quote_breakup_item
            tags: &on_select_message_order_quote_breakup_item_tags
              - &on_select_message_order_quote_breakup_item_tags_1
                code: TAX
                description: Describes the tax
                reference: <PR/Issue/Discussion Links md format text>
                list:
                  - code: CGST
                    description: Describes the CGST charges elements
                    reference: <PR/Issue/Discussion Links md format text>
                  - code: SGST
                    description: Describes the SGST charges elements
                    reference: <PR/Issue/Discussion Links md format text>
                  - code: SERVICE_TAX
                    description: Describes the SERVICE_TAX charges elements
                    reference: <PR/Issue/Discussion Links md format text>    
              - code: SELLER_FEES
                description: Describes the seller fee
                reference: <PR/Issue/Discussion Links md format text>
init: &init
  message: &init_message
    order: &init_message_order
      fulfillments: *on_search_message_catalog_providers_fulfillments
      payments: *search_message_intent_payment
on_init: &on_init
  message: &on_init_message
    order: &on_init_message_order
      fulfillments: *on_search_message_catalog_providers_fulfillments
      items: *on_search_message_catalog_providers_items
      payments: *search_message_intent_payment
      quote: *on_select_message_order_quote
confirm: *init
on_confirm: *on_init
on_status: *on_init
on_cancel: *on_init
on_update: *on_init
